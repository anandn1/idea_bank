<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea bank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="prompt">$</span> idea</div>
  <form id="capture-form" class="capture-form" autocomplete="off">
    <input
      id="capture-input"
      type="text"
      placeholder="capture an idea and hit enter..."
      autofocus
    >
  </form>
  <div class="capture-target" id="capture-target" role="group" aria-label="capture target status">
    <button type="button" class="target-pill selected" data-status="inbox">inbox</button>
    <button type="button" class="target-pill" data-status="active">active</button>
    <button type="button" class="target-pill" data-status="queued">queued</button>
    <button type="button" class="target-pill" data-status="horizon">horizon</button>
    <button type="button" class="target-pill" data-status="archive">archive</button>
  </div>
  <div class="mode-indicator" id="mode-indicator" hidden></div>
  <div class="help">
    <span><b>j/k</b> move</span>
    <span><b>a/q/h/x</b> move idea</span>
    <span><b>↵</b> open</span>
    <span><b>e</b> quick edit</span>
    <span><b>v</b> select range</span>
    <span><b>d</b> delete</span>
    <span><b>/</b> capture</span>
  </div>
</header>

<main class="board" id="board">
  <section class="column" data-status="inbox">
    <h2 class="column-title">Inbox</h2>
    <div class="cards" id="cards-inbox"></div>
  </section>
  <section class="column" data-status="active">
    <h2 class="column-title">Active</h2>
    <div class="cards" id="cards-active"></div>
  </section>
  <section class="column" data-status="queued">
    <h2 class="column-title">Queued</h2>
    <div class="cards" id="cards-queued"></div>
  </section>
  <section class="column" data-status="horizon">
    <h2 class="column-title">Horizon</h2>
    <div class="cards" id="cards-horizon"></div>
  </section>
  <section class="column" data-status="archive">
    <h2 class="column-title">Archive</h2>
    <div class="cards" id="cards-archive"></div>
  </section>
</main>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="idea detail">
    <div class="modal-header">
      <div class="modal-status-pills" id="modal-status-pills"></div>
      <button type="button" class="modal-close" id="modal-close" aria-label="close">×</button>
    </div>

    <textarea class="modal-text" id="modal-text" rows="3"></textarea>

    <div class="modal-section">
      <div class="modal-section-label">fields</div>
      <div class="modal-fields" id="modal-fields"></div>
      <button type="button" class="modal-add-field" id="modal-add-field">+ add field</button>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">notes</div>
      <textarea class="modal-notes" id="modal-notes" rows="2" placeholder="freeform notes..."></textarea>
    </div>

    <div class="modal-meta" id="modal-meta"></div>

    <div class="modal-footer">
      <button type="button" class="modal-delete" id="modal-delete">delete</button>
      <button type="button" class="modal-done" id="modal-done">done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
